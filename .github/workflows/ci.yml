name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Validate Userscript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Userscript Syntax
        run: |
          for file in *.user.js; do
            [ -f "$file" ] || continue
            node --check "$file"
            echo "Validated syntax: $file"
          done
